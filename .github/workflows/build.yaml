
name: Build-App

on:
  push:
    branches: [ "main", "qa", "dev", "feature" ]
  pull_request:
    branches: [ "main", "qa", "dev" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - name: Getting code
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Check formatting
      run: npm ci

    - name: Run Lint
      run: npm run lint
    
    - name: Build application
      if: github.ref != 'refs/heads/feature'
      run: npm run build --if-present
    
    - name: Build Docker Image
      if: github.ref != 'refs/heads/feature'
      run: | 
        docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/control-gastos:${{ github.sha }} \
          -t ${{ secrets.DOCKER_USERNAME }}/control-gastos:latest .

    - name: Login to Docker Hub
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}
    
    - name: Push Docker Image
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/control-gastos:${{ github.sha }}
        docker push ${{ secrets.DOCKER_USERNAME }}/control-gastos:latest
